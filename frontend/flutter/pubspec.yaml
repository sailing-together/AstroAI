name: AstroAI
description: "AstroAI is a horoscope app that provides personalized insights on career, love, health, and abilities based on user-provided information such as birth date."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0
  provider: ^6.1.5
  http: ^1.2.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/space.jpg
    - assets/MainSpace.png
    - assets/celebrity_matches.json
    - assets/daily_horoscopes.json
    - assets/sign_compatibility.json
    - assets/cosmic_events_2025.json
